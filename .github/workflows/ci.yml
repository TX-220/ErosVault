name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Renderer)
        run: npx tsc --noEmit

      - name: Type check (Main process)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build verification
        run: npm run build

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check for secrets
        run: |
          if grep -r "\.env\.local\|GITHUB_TOKEN\|API_KEY" src/ .gitignore; then
            echo "⚠️ Possible secrets found - check .gitignore"
            exit 1
          fi
          echo "✓ No secrets exposed"
