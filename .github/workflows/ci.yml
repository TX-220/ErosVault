name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (Renderer)
        run: npx tsc --noEmit

      - name: Type check (Main process)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build verification
        run: npm run build

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check for secrets in source
        run: |
          if grep -rE 'GITHUB_TOKEN|API_KEY|sk-[a-zA-Z0-9]{20,}' src/ public/ 2>/dev/null; then
            echo "Possible secrets found in source files"
            exit 1
          fi
          if [ -f .env.local ] || [ -f .env ]; then
            echo "Environment files must not be committed"
            exit 1
          fi
          echo "No secrets exposed in tracked source"