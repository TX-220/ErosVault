name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (renderer)
        run: npx tsc --noEmit

      - name: Type check (main process)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build Next.js
        run: npm run build:electron && next build

      - name: Verify build artifacts
        run: |
          test -d dist-electron && echo "✓ dist-electron exists"
          test -d out && echo "✓ out directory exists"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: |
          echo "✓ No linting configured (configure ESLint/Prettier as needed)"

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for hardcoded secrets
        run: |
          if grep -r "password\|api[_-]key\|secret" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "⚠ Warning: Potential hardcoded secrets found"
            exit 1
          else
            echo "✓ No hardcoded secrets detected"
          fi

  build:
    runs-on: ${{ matrix.os }}
    needs: [test, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: replicant-linux
          - os: macos-latest
            artifact-name: replicant-macos
          - os: windows-latest
            artifact-name: replicant-windows

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create distribution
        run: npm run dist
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/**/*
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=$(npm query '.version' --workspaces=false)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Replicant v${{ steps.version.outputs.VERSION }}

            Perfect file replication. Incremental backup with zero dialogs.

            See CHANGELOG for detailed changes.
          draft: false
          prerelease: false
